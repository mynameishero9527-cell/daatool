<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股量化工具</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">📈 A股量化工具</div>
  <nav class="main-tabs" id="mainTabs">
    <button class="tab active" data-tab="dashboard">行情看板</button>
    <button class="tab" data-tab="stock">个股分析</button>
    <button class="tab" data-tab="screener">个股筛选</button>
    <button class="tab" data-tab="sector">板块资金</button>
    <button class="tab" data-tab="macro">宏观情报</button>
    <button class="tab" data-tab="commodity">大宗商品</button>
    <button class="tab" data-tab="global">全球指数</button>
    <button class="tab" data-tab="recommend">个股推荐</button>
    <button class="tab" data-tab="settings">设置</button>
  </nav>
  <div class="statusbar">
    <span class="dot" id="healthDot"></span>
    <span id="lastRefresh">-</span>
  </div>
</header>

<main>
  <!-- 行情看板 -->
  <section class="page active" id="page-dashboard">
    <div class="index-strip" id="indexStrip"></div>
    <div class="grid-2" style="grid-template-columns: 1.5fr 1fr">
      <div class="card">
        <div class="card-title">上证指数 · 实时分时 <span class="muted" id="miniMinuteTime"></span></div>
        <div id="miniMinute" style="height:190px"></div>
      </div>
      <div class="card">
        <div class="card-title">明日预测概率 <span class="muted">启发式估计</span></div>
        <div id="forecastBox"><div class="empty">计算中…</div></div>
      </div>
    </div>
    <div class="grid-3">
      <div class="card">
        <div class="card-title">市场统计 <span class="muted" id="statsTime"></span></div>
        <div id="marketStats" class="stats-row"></div>
      </div>
      <div class="card">
        <div class="card-title">市场情绪与大周期</div>
        <div id="marketSentiment"><div class="empty">计算中…</div></div>
        <div id="marketCycle"></div>
      </div>
      <div class="card">
        <div class="card-title">领涨 / 领跌 <span class="muted">各20条</span></div>
        <div class="grid-2 movers movers-scroll" id="movers"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">智能提醒 <span class="muted">每10分钟自动扫描 · 量化参考不构成投资建议</span></div>
      <div id="alertFeed" class="alert-feed"><div class="empty">暂无提醒</div></div>
    </div>
    <div class="card">
      <div class="card-title">自选股
        <span class="inline-form">
          <input id="watchInput" placeholder="输入代码，如 300432" maxlength="8">
          <button class="btn" onclick="addWatch()">添加</button>
        </span>
      </div>
      <div id="watchTable"></div>
    </div>
  </section>

  <!-- 个股分析 -->
  <section class="page" id="page-stock">
    <div class="card">
      <div class="search-wrap">
        <input id="stockSearch" placeholder="搜索股票代码 / 名称，如 300432 或 富临">
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
    <div class="grid-stock">
      <div class="card">
        <div id="stockProfile"></div>
        <div class="card-title"><span id="klineTitle">K线走势</span>
          <span class="btn-group" id="periodBtns">
            <button class="opt active" data-period="minute">分时</button>
            <button class="opt" data-period="day">日K</button>
            <button class="opt" data-period="week">周K</button>
            <button class="opt" data-period="month">月K</button>
          </span>
        </div>
        <div id="klineChart" class="chart-lg"></div>
      </div>
      <div class="card score-card" id="scoreCard">
        <div class="empty">搜索并选择一只股票查看评分</div>
      </div>
    </div>
  </section>

  <!-- 个股筛选 -->
  <section class="page" id="page-screener">
    <div class="card">
      <div class="card-title">筛选条件
        <span class="inline-form">
          <span class="btn-group" id="presetBtns"></span>
          <button class="btn ghost" onclick="clearScreener()">清空条件</button>
          <button class="btn" onclick="savePlan()">保存方案</button>
        </span>
      </div>
      <div id="screenerConditions"><div class="empty">加载中…</div></div>
    </div>
    <div class="card">
      <div class="card-title sticky-result"><span>筛选结果 <span class="muted" id="screenerCount"></span></span>
        <span class="btn-group" id="screenerOrder">
          <button class="opt active" data-order="buy_index">按购买指数</button>
          <button class="opt" data-order="main_flow">按主力净流入</button>
          <button class="opt" data-order="dark">按暗盘力量</button>
          <button class="opt" data-order="pct">按涨幅</button>
        </span>
      </div>
      <div id="screenerResult"><div class="empty">设置条件后自动筛选</div></div>
    </div>
    <div class="card" id="planList" style="display:none">
      <div class="card-title">已保存方案</div>
      <div id="planItems"></div>
    </div>
  </section>

  <!-- 板块资金 -->
  <section class="page" id="page-sector">
    <div class="card">
      <div class="card-title">板块资金全景 <span class="muted" id="sectorTime"></span>
        <span class="btn-group">
          <span id="sectorDim">
            <button class="opt active" data-dim="industry">行业板块</button>
            <button class="opt" data-dim="concept">题材概念</button>
          </span>
          <span id="sectorView" style="margin-left:10px">
            <button class="opt active" data-view="map">热力图</button>
            <button class="opt" data-view="list">列表</button>
          </span>
        </span>
      </div>
      <div class="muted" style="margin-bottom:8px">方块大小 = 成交额；颜色 = 主力净流入（红入绿出）。点击方块查看成分股。</div>
      <div id="sectorMap" class="chart-lg"></div>
      <div id="sectorList" style="display:none"></div>
    </div>
    <div class="card" id="sectorDrill" style="display:none">
      <div class="card-title" id="sectorDrillTitle">成分股</div>
      <div id="sectorDrillTable"></div>
    </div>
  </section>

  <!-- 宏观情报 -->
  <section class="page" id="page-macro">
    <div class="btn-group sub-tabs" id="macroTabs">
      <button class="opt active" data-sub="news">实时快讯</button>
      <button class="opt" data-sub="outlook">事件展望</button>
      <button class="opt" data-sub="calendar">事件日历</button>
      <button class="opt" data-sub="policy">政策追踪</button>
      <button class="opt" data-sub="major">影响评估</button>
    </div>
    <div class="card" id="macroContent"><div class="empty">加载中…</div></div>
  </section>

  <!-- 大宗商品 -->
  <section class="page" id="page-commodity">
    <div class="btn-group sub-tabs multi" id="commodityCats"></div>
    <div class="cards-grid" id="commodityGrid"></div>
    <div class="card" id="commodityKlineCard" style="display:none">
      <div class="card-title"><span id="ckTitle">商品K线</span>
        <span class="btn-group" id="ckPeriod">
          <button class="opt active" data-p="day">日K</button>
          <button class="opt" data-p="week">周K</button>
          <button class="opt" data-p="month">月K</button>
          <button class="btn small ghost" onclick="closeCommodityKline()" style="margin-left:8px">关闭</button>
        </span>
      </div>
      <div id="ckChart" style="height:380px"></div>
    </div>
  </section>

  <!-- 全球指数 -->
  <section class="page" id="page-global">
    <div class="btn-group sub-tabs" id="globalTabs">
      <button class="opt active" data-sub="indices">全球指数</button>
      <button class="opt" data-sub="etf">ETF 专区</button>
    </div>
    <div id="globalContent"></div>
  </section>

  <!-- 个股推荐 -->
  <section class="page" id="page-recommend">
    <div class="btn-group sub-tabs" id="recommendBoards"></div>
    <div class="card">
      <div class="cond-inline" style="margin-bottom:10px; gap:20px">
        <span><span class="g-label muted">操作提示</span>
          <span class="btn-group" id="recAdvice">
            <button class="opt active" data-v="">全部</button>
            <button class="opt" data-v="增持">增持</button>
            <button class="opt" data-v="减持">减持</button>
            <button class="opt" data-v="保持不变">保持不变</button>
          </span></span>
        <span><span class="g-label muted">评分下限</span>
          <span class="btn-group" id="recScore">
            <button class="opt active" data-v="0">全部</button>
            <button class="opt" data-v="55">≥55</button>
            <button class="opt" data-v="65">≥65</button>
            <button class="opt" data-v="75">≥75</button>
            <button class="opt" data-v="85">≥85</button>
            <button class="opt" data-v="95">≥95</button>
          </span></span>
        <span><span class="g-label muted">量能</span>
          <span class="btn-group" id="recVol">
            <button class="opt active" data-v="">全部</button>
            <button class="opt" data-v="surge">放量</button>
            <button class="opt" data-v="normal">平稳</button>
            <button class="opt" data-v="shrink">缩量</button>
          </span></span>
        <span><span class="g-label muted">排序</span>
          <span class="btn-group" id="recOrder">
            <button class="opt active" data-v="">榜单指标</button>
            <button class="opt" data-v="score">评分</button>
            <button class="opt" data-v="buy_index">购买指数</button>
            <button class="opt" data-v="pct">涨跌幅</button>
          </span></span>
      </div>
      <div id="recommendTable"><div class="empty">加载中…</div></div>
      <div class="pager" id="recPager"></div>
    </div>
  </section>

  <!-- 设置 -->
  <section class="page" id="page-settings">
    <div class="grid-2">
      <div class="card">
        <div class="card-title">数据源健康</div>
        <div id="sourceHealth"></div>
      </div>
      <div class="card">
        <div class="card-title">缓存状态
          <button class="btn danger" onclick="clearCache()">清空缓存</button>
        </div>
        <div id="cacheStats"></div>
        <div class="card-title" style="margin-top:14px">全量同步
          <button class="btn" onclick="fullSync()">立即同步</button>
        </div>
        <div id="syncState"></div>
        <div class="card-title" style="margin-top:14px">指标重建（K线+企稳/购买指数/情绪/暗盘）
          <button class="btn" onclick="rebuildMetrics()">重建指标</button>
        </div>
        <div id="metricsState"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">定时任务</div>
      <div id="jobTable"></div>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
